<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IgniVox - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        igniRed: '#B20000',
                        igniOrange: '#FF8C00',
                    }
                }
            }
        }
    </script>
    <style>
  @keyframes puntos {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  .animacion-puntos::after {
    content: '';
    animation: puntos 1.5s infinite;
    display: inline-block;
    width: 12px;
    text-align: left;
  }
</style>
</head>
<body class="bg-white font-sans antialiased">
    <div id="app">
        </div>
    <script src="app.js"></script>
</body>
</html>
